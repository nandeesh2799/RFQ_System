version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfq_british_auction_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=postgresql://rfq_user:rfq_password@db:5432/rfq_auction_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rfq_british_auction_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-rfq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rfq_password}
      POSTGRES_DB: ${DB_NAME:-rfq_auction_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rfq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rfq_user} -d ${DB_NAME:-rfq_auction_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rfq_pgdata:
